<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7A2E5E">
<title>Cacao Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout : une colonne de jeu mobile (max 480px), chemin sinueux de leçons, écrans plein cadre */
:root{
  --bg:#FFFCF5; --surface:#FFFFFF; --line:#EADFCF; --ink:#3A2420; --muted:#8A7468;
  --bean:#7A2E5E; --bean-d:#561E41; --pod:#F2A900; --pod-d:#C98600;
  --ok:#2FA45A; --ok-d:#1F7A40; --ok-bg:#DDF5E4; --ko:#E04848; --ko-d:#B12F2F; --ko-bg:#FCE3E1;
  --lock:#E4DCD2; --lock-d:#C9BEB1;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1311; --surface:#2A1D1A; --line:#40302B; --ink:#F6ECE4; --muted:#B39F94;
  --bean:#B85A93; --bean-d:#843D68; --pod:#F5B82A; --pod-d:#B98208;
  --ok:#3FBF6C; --ok-d:#258A4A; --ok-bg:#163423; --ko:#F06464; --ko-d:#B53A3A; --ko-bg:#3E1C1C;
  --lock:#3A2C28; --lock-d:#2A1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1311; --surface:#2A1D1A; --line:#40302B; --ink:#F6ECE4; --muted:#B39F94;
  --bean:#B85A93; --bean-d:#843D68; --pod:#F5B82A; --pod-d:#B98208;
  --ok:#3FBF6C; --ok-d:#258A4A; --ok-bg:#163423; --ko:#F06464; --ko-d:#B53A3A; --ko-bg:#3E1C1C;
  --lock:#3A2C28; --lock-d:#2A1F1C; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--pod);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
.ico{width:22px;height:22px;flex:none}

/* barre de stats */
.stats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding-block:12px;border-bottom:2px solid var(--line)}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.stat.flame{color:#F07B1F}.stat.xp{color:var(--bean)}.stat.heart{color:var(--ko)}
.stat.off{color:var(--muted);opacity:.7}

/* bannière d'unité */
.unit{margin-top:18px;background:var(--bean);color:#fff;border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 var(--bean-d)}
.unit small{display:block;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-size:12px}
.unit h1{font-size:24px;line-height:1.2}
.unit p{margin:2px 0 0;font-size:14px;opacity:.9}
.unit svg{width:64px;height:64px;flex:none}

/* chemin */
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:52px 24px}
.stop{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.node{width:76px;height:72px;border-radius:50%;border:none;display:grid;place-items:center;background:var(--pod);box-shadow:0 7px 0 var(--pod-d);transition:transform .1s,box-shadow .1s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--pod-d)}
.node svg{width:36px;height:36px}
.node.current{background:var(--bean);box-shadow:0 7px 0 var(--bean-d)}
.node.current:active{box-shadow:0 2px 0 var(--bean-d)}
.node.locked{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);cursor:not-allowed}
.node.locked svg{opacity:.55}
.node.chest{border-radius:20px}
.stop .lbl{font-family:var(--f-display);font-weight:600;font-size:15px;text-align:center;max-width:170px;line-height:1.25}
.stop.locked .lbl{color:var(--muted)}
.ring{position:absolute;top:-8px;width:92px;height:88px;border-radius:50%;border:4px solid var(--bean);opacity:.35;pointer-events:none;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.5}100%{transform:scale(1.15);opacity:0}}
.go{position:absolute;top:-44px;background:var(--surface);border:2px solid var(--line);color:var(--bean);font-family:var(--f-display);font-weight:700;padding:4px 12px;border-radius:12px;font-size:14px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.go::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.foot{text-align:center;padding-block:8px 28px;color:var(--muted);font-size:13px}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:6px}
.linkbtn.warn{color:var(--ko);font-weight:700}

/* leçon */
.lesson{display:flex;flex-direction:column;min-height:100%;flex:1}
.ltop{display:flex;align-items:center;gap:12px;padding-block:14px}
.close{background:none;border:none;padding:4px;color:var(--muted);display:grid}
.bar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.qwrap{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:8px 24px}
.kind{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--bean)}
.qtext{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.3}
.speak{display:flex;gap:12px;align-items:flex-start}
.speak svg{width:58px;height:58px;flex:none}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;position:relative;font-weight:600;min-width:0}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 14px;font-weight:700;transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt .k{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.opt.sel{border-color:var(--bean);background:color-mix(in srgb,var(--bean) 10%,var(--surface));color:var(--bean)}
.opt.sel .k{border-color:var(--bean);color:var(--bean)}
.opt:disabled{cursor:default}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf .opt{justify-content:center;font-size:20px;font-family:var(--f-display);padding-block:22px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:10px;align-content:start;min-width:0}
.pairs .opt{justify-content:center;text-align:center;font-size:14px;padding:12px 8px;min-height:64px}
.opt.done{border-color:var(--ok);color:var(--ok);background:var(--ok-bg);opacity:.75}
.opt.bad{border-color:var(--ko);color:var(--ko);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:10px;counter-reset:o}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-weight:700}
.answer .chip{counter-increment:o}
.answer .chip::before{content:counter(o) ". ";color:var(--bean)}
.chip.ghost{visibility:hidden}
.fillq{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.7}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--bean);color:var(--bean);text-align:center;padding:0 6px;line-height:1.3}

/* pied / feedback */
.lfoot{position:sticky;bottom:0;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2px solid var(--line);background:var(--bg)}
.lfoot.ok{background:var(--ok-bg);border-color:transparent}
.lfoot.ko{background:var(--ko-bg);border-color:transparent}
.fb{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.fb .badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.fb h3{font-size:22px}
.lfoot.ok .fb h3{color:var(--ok)}.lfoot.ko .fb h3{color:var(--ko)}
.fb p{margin:4px 0 0;font-size:15px}
.fb .sol{font-weight:800}
.big{width:100%;border:none;border-radius:16px;padding:15px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;background:var(--bean);color:#fff;box-shadow:0 5px 0 var(--bean-d);transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bean-d)}
.big:disabled{background:var(--lock);color:var(--muted);box-shadow:0 5px 0 var(--lock-d);cursor:default;transform:none}
.big.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.big.ko{background:var(--ko);box-shadow:0 5px 0 var(--ko-d)}

/* fin */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:32px}
.end svg.mascot{width:130px;height:130px}
.end h2{font-size:30px;color:var(--pod-d)}
.end.fail h2{color:var(--ko)}
.end p{margin:0;color:var(--muted);max-width:32ch}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border-radius:14px;border:2px solid var(--c);overflow:hidden}
.tile b{display:block;background:var(--c);color:#fff;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px}
.tile span{display:flex;justify-content:center;align-items:center;gap:4px;padding:10px 4px;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--c);font-variant-numeric:tabular-nums}
.endbtns{width:100%;display:grid;gap:10px}
.big.alt{background:var(--surface);color:var(--bean);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
/* citation du module */
.unit .quote{margin-top:6px;font-style:italic;font-size:14px;opacity:.95;text-wrap:balance}
/* coche multiple */
.mhint{margin:-2px 0 0;color:var(--muted);font-size:14px;font-weight:700}
.opt.chk .k{border-radius:6px}
.opt.chk.sel .k{background:var(--bean);border-color:var(--bean)}
.opt.chk.sel .k::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 3px 3px;transform:translateY(-2px) rotate(-45deg)}
.opt.miss{border-color:var(--ok);border-style:dashed;color:var(--ok)}
.opt.chk.bad{animation:none;background:var(--ko-bg)}
/* annales */
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.anb{font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--ink);background:color-mix(in srgb,var(--pod) 30%,var(--bg));border:2px solid var(--pod);border-radius:99px;padding:2px 10px}
.stop .lbl .tag{display:block;margin:4px auto 0;width:max-content;font-family:var(--f-body);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--bean)}
/* liste des modules */
.unit{width:100%;text-align:left;border:none;font:inherit;color:#fff;cursor:pointer}
.unit small{white-space:nowrap}
.ulist{display:grid;gap:10px;padding-block:14px 24px}
.ucard{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px}
.ucard.on{border-color:var(--bean)}
.unum{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bean);color:#fff;font-family:var(--f-display);font-weight:700;font-size:18px}
.ubody{min-width:0;display:grid;gap:4px}
.ubody b{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.25}
.ubody small{color:var(--muted);font-size:13px}
.ubar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.ubar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.ucheck{width:30px;height:30px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.ucheck svg{width:18px;height:18px}
#next{margin-bottom:8px}
/* navigation basse */
.app.withnav{padding-bottom:92px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--line);display:flex;justify-content:center;gap:10px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav button{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:2px solid transparent;border-radius:14px;padding:6px;font-weight:800;font-size:13px;color:var(--muted)}
.nav button svg{width:26px;height:26px}
.nav button.on{border-color:var(--bean);color:var(--bean);background:color-mix(in srgb,var(--bean) 10%,var(--bg))}

/* camarades sur le chemin */
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;border:2px solid var(--bg);flex:none;text-transform:uppercase}
.mates{position:absolute;left:calc(50% + 46px);top:20px;display:flex;align-items:center}
.mates .av+.av{margin-left:-9px}
.mates .more{margin-left:4px;font-size:12px;font-weight:800;color:var(--muted)}

/* classement */
.bh{font-size:26px;margin-top:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--line);padding:4px;border-radius:14px;margin-top:12px}
.seg button{border:none;background:none;border-radius:10px;padding:9px 6px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--bean);box-shadow:0 2px 0 var(--line)}
.binfo{margin:14px 0 6px;color:var(--muted);font-size:14px}
.rows{display:grid;gap:6px;padding-bottom:16px}
.row{display:grid;grid-template-columns:30px 36px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:2px solid transparent}
.row .av{width:36px;height:36px;font-size:14px}
.row.me{border-color:var(--bean);background:color-mix(in srgb,var(--bean) 9%,var(--bg))}
.row .rk{font-family:var(--f-display);font-weight:700;font-size:18px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.row .rk.m{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px}
.row .nm{min-width:0}
.row .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{color:var(--muted);font-size:13px}
.row .sc{font-family:var(--f-display);font-weight:700;color:var(--bean);font-variant-numeric:tabular-nums;white-space:nowrap}
.gap{text-align:center;color:var(--muted);letter-spacing:.3em;font-weight:800}
.note{border:2px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:14px;color:var(--muted);margin-top:14px}
.muted{color:var(--muted)}

/* inscription */
.onb{display:flex;flex-direction:column;gap:16px;padding-block:28px}
.onb .hello{display:flex;gap:14px;align-items:center}
.onb .hello svg{width:84px;height:84px;flex:none}
.onb h1{font-size:26px;line-height:1.2}
.onb label{font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--bean)}
.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.classes .opt{justify-content:center;font-family:var(--f-display);font-size:18px}
.field{width:100%;font:inherit;font-weight:700;font-size:18px;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
.field:focus{outline:none;border-color:var(--bean)}
.codefield{text-align:center;font-family:var(--f-display);font-size:26px;letter-spacing:.3em;text-transform:uppercase}
.hint{margin:0;color:var(--muted);font-size:14px}
.err{margin:0;color:var(--ko);font-weight:700;font-size:14px}
.ask{border:2px solid var(--pod);border-radius:14px;padding:14px;display:grid;gap:10px;background:color-mix(in srgb,var(--pod) 10%,var(--bg))}
.ask p{margin:0;font-weight:700}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav" hidden>
 <button id="navLearn"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z" fill="currentColor"/></svg>Apprendre</button>
 <button id="navBoard"><svg viewBox="0 0 24 24"><path d="M7 4h10v3a5 5 0 0 1-10 0zM7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 12v4M8 20h8l-1-4H9z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Classement</button>
</nav>

<script>
/* ---------- icônes et mascotte (dessins originaux) ---------- */
const I={
 flame:'<svg class="ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c1 3.5 5 5.6 5 10.5A5 5 0 0 1 7 12.6c0-2 1-3.4 2.2-4.4.1 1.6.8 2.7 1.8 3.2C10.4 8 11 4.6 12 2z"/></svg>',
 bean:'<svg class="ico" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="7" ry="9.5" transform="rotate(30 12 12)" fill="currentColor"/><path d="M8.5 17.5c2-3 3.5-7 6.5-11" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".7"/></svg>',
 heart:'<svg class="ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg>',
 close:'<svg width="26" height="26" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 lock:'<svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="2.4" fill="none"/></svg>',
 exam:'<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z" fill="#fff"/><path d="M9 11h7M9 14h7M9 17h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
 star:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>',

async function api(params){const r=await fetch(API+"?"+new URLSearchParams(params));return r.json()}
let flushing=false;
async function flush(){
 if(!API||flushing||!P.code)return;flushing=true;
 while(P.pending.length){
  try{
   const r=await fetch(API,{method:"POST",body:JSON.stringify({...P.pending[0],code:P.code})});const j=await r.json();
   if(j.reason==="code"){flushing=false;return logout("Ton code a changé. Demande le nouveau à ton formateur.")}
   if(j.reason==="trop-rapide"){setTimeout(flush,2*60000);break} // on réessaie plus tard, rien n'est perdu
   if(j.ok||j.drop){P.pending.shift();save()}else break;
  }catch(e){break}
 }
 flushing=false;
}

 if(!me){me={classe:P.classe,pseudo:P.pseudo,total:0,week:0,done:[]};pl.push(me)}
 if(API){ // le serveur fait foi ; on ajoute seulement ce qui n'est pas encore parti
  const wait=P.pending.reduce((s,x)=>s+(x.xp||0),0);

 }else{me.total=P.xp;me.week=weekXp()}

 BOARD=pl;BOARD_AT=Date.now();return pl;

 if(L.bonus){ // coffre : priorité aux questions tombées aux annales (6 sur 8, 8 sur 10)
  const all=pool.filter(l=>!l.bonus).flatMap(l=>l.qs),n=L.bonus==="all"?10:8,nA=L.bonus==="all"?8:6;

function rMulti(q,b){
 const opts=shuffle(q.o.map((t,i)=>({t,ok:q.c.includes(i)})));
 b.innerHTML=`<div class="qtext">${esc(q.q)}</div><p class="mhint">${q.c.length} bonnes réponses à trouver</p><div class="opts">${opts.map((o,i)=>`<button class="opt chk" data-i="${i}" aria-pressed="false"><span class="k"></span>${esc(o.t)}</button>`).join("")}</div>`;
 const sel=new Set();
 b.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{if(S.phase!=="check")return;const i=+el.dataset.i;
  if(sel.has(i))sel.delete(i);else sel.add(i);el.classList.toggle("sel",sel.has(i));el.setAttribute("aria-pressed",sel.has(i));setReady(sel.size>0)});
 S.check=()=>{
  const ok=opts.every((o,i)=>o.ok===sel.has(i));
  if(S.phase==="check")b.querySelectorAll(".opt").forEach((el,i)=>{const o=opts[i];el.disabled=true;
   if(o.ok&&sel.has(i))el.classList.add("done");else if(o.ok)el.classList.add("miss");else if(sel.has(i))el.classList.add("bad")});
  const found=opts.filter((o,i)=>o.ok&&sel.has(i)).length;
  return {ok,sol:`${found} / ${q.c.length} trouvés. Il fallait cocher : ${q.c.map(i=>q.o[i]).join(" ; ")}`};
 };
}
function rVf(q,b){
 b.innerHTML=`<div class="qtext">${esc(q.q)}</div><div class="vf"><button class="opt" data-v="1">Vrai</button><button class="opt" data-v="0">Faux</button></div>`;
 let sel=null;
 b.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{if(S.phase!=="check")return;b.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");sel=el.dataset.v==="1";setReady(true)});
 S.check=()=>({ok:sel===q.a,sol:q.a?"Vrai":"Faux"});
}
function rFill(q,b){
 const [a,c]=q.q.split("___");
 const opts=shuffle(q.o.map((t,i)=>({t,ok:i===q.a})));
 b.innerHTML=`<div class="fillq">${esc(a)}<span class="blank" id="blank">&nbsp;</span>${esc(c)}</div><div class="bank">${opts.map((o,i)=>`<button class="chip" data-i="${i}">${esc(o.t)}</button>`).join("")}</div>`;
 let sel=null;
 b.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{if(S.phase!=="check")return;b.querySelectorAll(".chip").forEach(x=>x.classList.remove("ghost"));el.classList.add("ghost");sel=+el.dataset.i;document.getElementById("blank").textContent=opts[sel].t;setReady(true)});
 S.check=()=>({ok:opts[sel].ok,sol:q.o[q.a]});
}
function rOrder(q,b){
 let bank=shuffle(q.o);while(bank.join()===q.o.join())bank=shuffle(q.o);
 const ans=[];
 const draw=()=>{
  b.innerHTML=`<div class="qtext">${esc(q.q)}</div><div class="answer" aria-label="Ta réponse">${ans.map((t,i)=>`<button class="chip" data-a="${i}">${esc(t)}</button>`).join("")}</div>
  <div class="bank">${bank.map((t,i)=>`<button class="chip ${ans.includes(t)?'ghost':''}" data-b="${i}">${esc(t)}</button>`).join("")}</div>`;
  b.querySelectorAll("[data-b]").forEach(el=>el.onclick=()=>{if(S.phase!=="check"||ans.includes(bank[+el.dataset.b]))return;ans.push(bank[+el.dataset.b]);draw()});
  b.querySelectorAll("[data-a]").forEach(el=>el.onclick=()=>{if(S.phase!=="check")return;ans.splice(+el.dataset.a,1);draw()});
  setReady(ans.length===q.o.length);
 };
 draw();
 S.check=()=>({ok:ans.join("|")===q.o.join("|"),sol:q.o.join(" → ")});
}
function rPairs(q,b){
 const L=shuffle(q.p.map((p,i)=>({t:p[0],i}))),R=shuffle(q.p.map((p,i)=>({t:p[1],i})));
 b.innerHTML=`<div class="qtext">${esc(q.q)}</div><div class="pairs"><div class="col">${L.map(o=>`<button class="opt" data-s="L" data-i="${o.i}">${esc(o.t)}</button>`).join("")}</div><div class="col">${R.map(o=>`<button class="opt" data-s="R" data-i="${o.i}">${esc(o.t)}</button>`).join("")}</div></div>`;
 let pick=null,found=0;
 b.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{
  if(el.classList.contains("done"))return;
  if(!pick||pick.dataset.s===el.dataset.s){if(pick)pick.classList.remove("sel");pick=el;el.classList.add("sel");return}
  const a=pick,c=el;pick=null;a.classList.remove("sel");
  if(a.dataset.i===c.dataset.i){[a,c].forEach(x=>{x.classList.add("done");x.disabled=true});found++;
   if(found===q.p.length){S.check=()=>({ok:true});setTimeout(()=>{setReady(true);onGo()},300)}}
  else{[a,c].forEach(x=>{x.classList.remove("bad");void x.offsetWidth;x.classList.add("bad")});setTimeout(()=>[a,c].forEach(x=>x.classList.remove("bad")),400)}
 });
}

function onGo(){
 if(!S||!S.ready)return;
 const q=S.queue[S.pos],foot=document.getElementById("foot");
 if(S.phase==="check"){
  const r=S.check();S.phase="next";
  if(r.ok){S.correct++;}
  else{S.hearts--;S.mistakes++;S.queue.push(q);}
  document.querySelector(".bar i").style.width=(S.correct/S.total*100)+"%";
  document.querySelector(".ltop .stat").innerHTML=I.heart+S.hearts;
  const praise=["Excellent !","Bravo !","Parfait !","Bien joué !"][Math.floor(Math.random()*4)];
  foot.className="lfoot "+(r.ok?"ok":"ko");
  foot.innerHTML=`<div class="fb pop"><span class="badge">${r.ok?I.okb:I.kob}</span><div><h3>${r.ok?praise:"Pas tout à fait…"}</h3>
   ${!r.ok?(q.k==="multi"?`<p>${esc(r.sol)}</p>`:`<p>Bonne réponse : <span class="sol">${esc(r.sol)}</span></p>`):""}${q.x?`<p>${esc(q.x)}</p>`:""}</div></div>
   <button class="big ${r.ok?'ok':'ko'}" id="go">Continuer</button>`;
  const g=document.getElementById("go");g.onclick=onGo;g.focus();
 }else{
  if(S.hearts<=0)return fail();
  S.pos++;
  if(S.pos>=S.queue.length)return finish();
  renderQ();
 }
}

/* mêmes règles que le script Google : 10 XP (+5 sans faute) la 1re fois, 5 XP pour une révision par jour */
function finish(){
 const u=UNITS[S.ui],L=u.lecons[S.i],k=lkey(u,S.i),today=day(new Date());
 const perfect=S.mistakes===0,first=!P.done[k];
 const gain=first?10+(perfect?5:0):(P.replays[k]===today?0:5);
 if(!first)P.replays[k]=today;
 const acc=Math.round(S.total/(S.total+S.mistakes)*100);
 P.xp+=gain;P.done[k]=true;bumpStreak();
 if(P.wk.k!==weekKey())P.wk={k:weekKey(),xp:0};P.wk.xp+=gain;
 P.pending.push({unit:u.id,lesson:S.i,titre:L.t,acc,perfect,xp:gain});
 save();BOARD=null;flush();
 const msg=first?(perfect?"bonus de 5 XP pour le sans-faute.":"les questions ratées sont revenues jusqu'à la bonne réponse.")
  :gain?"leçon revue, 5 XP de révision.":"déjà revue aujourd'hui : pas d'XP en plus, mais ta mémoire te dit merci.";
 app.innerHTML=`<div class="end"><div class="pop">${mascot()}</div><h2>${perfect?"Sans faute !":"Leçon terminée !"}</h2>
 <p>${esc(L.t)} : ${msg}</p>
 <div class="tiles">
  <div class="tile" style="--c:var(--pod-d)"><b>XP gagnés</b><span>+${gain}</span></div>
  <div class="tile" style="--c:var(--ok)"><b>Précision</b><span>${acc} %</span></div>
  <div class="tile" style="--c:#F07B1F"><b>Série</b><span>${P.streak} j</span></div></div>
 <div class="endbtns"><button class="big" id="cont">Continuer</button></div></div>`;
 document.getElementById("cont").onclick=()=>renderPath();
}
function fail(){
 app.innerHTML=`<div class="end fail"><div class="pop">${mascot('sad')}</div><h2>Plus de vies !</h2>
 <p>Pas grave : relis ton cours sur ce point, puis retente la leçon. Tu repars avec 5 vies.</p>
 <div class="endbtns"><button class="big" id="retry">Réessayer</button><button class="big alt" id="back">Retour au chemin</button></div></div>`;
 document.getElementById("retry").onclick=()=>startLesson(S.ui,S.i);
 document.getElementById("back").onclick=()=>renderPath();
}

/* clavier : 1-4 pour choisir, Entrée pour valider */
document.addEventListener("keydown",e=>{
 if(!S||!document.getElementById("go"))return;
 if(e.key==="Enter"&&S.ready&&document.activeElement?.id!=="go"){e.preventDefault();onGo()}
 const n=+e.key;if(n>=1&&n<=4){const b=document.querySelectorAll("#qbody .opt")[n-1];if(b&&!b.dataset.s)b.click()}
});

/* ---------- démarrage ---------- */
(async()=>{
 try{await loadUnits()}catch(e){
  app.innerHTML=`<div class="end fail"><h2>Contenu introuvable</h2><p>Le fichier de questions ne s'est pas chargé. Vérifie ta connexion, puis recharge la page.</p></div>`;return;
 }
 if(P.code&&P.pseudo){renderPath();await resync();if(!nav.hidden&&document.getElementById("out"))renderPath();flush();}
 else renderLogin();
 window.addEventListener("online",flush);
})();
</script>
